name: emi_calc
description: A modern finance calculator app built with Flutter.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # -----------------------------
  # State Management
  # -----------------------------
  flutter_riverpod: ^2.6.1

  # -----------------------------
  # Navigation
  # -----------------------------
  go_router: ^16.1.0

  # -----------------------------
  # Fonts
  # -----------------------------
  google_fonts: ^6.3.0

  # -----------------------------
  # Local Storage
  # -----------------------------
  shared_preferences: ^2.5.3

  # -----------------------------
  # Utilities
  # -----------------------------
  intl: ^0.20.2
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2
  share_plus: ^11.1.0

  # -----------------------------
  # Charts
  # -----------------------------
  fl_chart: ^1.1.1

  # -----------------------------
  # Animations
  # -----------------------------
  flutter_animate: ^4.5.2

  # -----------------------------
  # Firebase
  # -----------------------------
  firebase_core: ^4.1.1
  firebase_analytics: ^12.0.1
  firebase_crashlytics: ^5.0.1

  # -----------------------------
  # Ads
  # -----------------------------
  # google_mobile_ads: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/json/
    - assets/animations/

  # fonts:
